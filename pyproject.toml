[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"
[project]
name="ora-schema-explorer"
version="0.1.0"
description="Offline Oracle schema explorer from DDL and SQL files."
readme="README.md"
requires-python=">=3.10"
license={text="MIT"}
authors=[{name="Raoul Munet"}]
dependencies=[
  "ora-core @ git+https://github.com/raoulmunet/ora-core.git",
  "ora-doc @ git+https://github.com/raoulmunet/ora-doc.git"
]
[project.optional-dependencies]
dev=["pytest>=8"]
[project.scripts]
ora-schema-explorer="ora_schema_explorer.cli:main"
[tool.setuptools.packages.find]
where=["src"]
[tool.pytest.ini_options]
pythonpath=["src"]
testpaths=["tests"]
